[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter-agent"
version = "0.1.0"
description = "Autonomous job-application pipeline: scrape, filter, score, tailor, gate, submit. Humans only decide, register accounts, and hand over SMS codes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "your-name" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
jh = "jobhunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
