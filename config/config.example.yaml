# jobhunter-agent configuration
# Copy to config/config.yaml and edit.

# What to search for on each source adapter.
query: "python backend"

# Score cut-off: only jobs with score >= min_score get tailored & submitted.
min_score: 80

# Per-day submission cap. The agent will not go over this, even if there
# are more good jobs -- this is both politeness and anti-ban.
daily_cap: 30

# Hard filter: the JD must contain at least one of these strings (case-insensitive).
# Empty list disables this check.
must_have_any:
  - python
  - backend
  - golang
  - fastapi
  - distributed

# Where screenshots of each submission go.
screenshot_dir: "data/shots"

# BOSS直聘 source. Run `jh login` once before using this.
use_zhipin: true
# City codes: 101010100 Beijing, 101020100 Shanghai, 101210100 Hangzhou,
# 101220100 Hefei, 101220800 Anqing, 101190400 Nanjing.
zhipin_city: "101220800"
